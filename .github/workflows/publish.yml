# PyPI Trusted Publishing (OIDC): no long-lived PyPI tokens or TWINE_PASSWORD.
# Configure on https://pypi.org → Project → Publishing → add GitHub publisher.
# This workflow must stay on the trusted publisher (repo + workflow file + environment).
name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual runs exercise build/test/artifact handling without publishing
  # (the publish job is guarded to release events).
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -v -s tests -p 'test_*.py'

  # Dispatch-only: proves the artifact round-trip (upload v7 → download v8)
  # without publishing. No-op on release runs.
  verify-artifacts:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Verify sdist and wheel are present
        run: ls -l dist/ && test -n "$(find dist -name '*.whl')" && test -n "$(find dist -name '*.tar.gz')"

  publish:
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
